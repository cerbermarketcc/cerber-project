services:
  - type: web
    name: cerber-project
    env: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ADMIN_JWT_SECRET
        sync: false
      - key: DATA_ENCRYPTION_KEY
        sync: false
      - key: SELLER_ADMIN_SECRET
        sync: false
      - key: CAPTCHA_SECRET
        sync: false
      - key: IP_HASH_SECRET
        sync: false
      - key: ADMIN_TOTP_SECRET
        sync: false
      - key: MARKET_ADMIN_LOGIN
        sync: false
      - key: MARKET_ADMIN_PASSWORD
        sync: false
      - key: TURNSTILE_SITE_KEY
        sync: false
      - key: TURNSTILE_SECRET_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: "https://cerber-project.onrender.com,https://cerber.to,https://www.cerber.to,https://cerber.love,https://www.cerber.love,https://cerber.vip,https://www.cerber.vip"
      - key: ALLOWED_HOSTS
        value: "cerber-project.onrender.com,cerber-project,cerber.to,www.cerber.to,cerber.love,www.cerber.love,cerber.vip,www.cerber.vip"
      - key: USER_SESSION_TTL_HOURS
        value: "336"
      - key: NOWPAYMENTS_API_KEY
        sync: false
      - key: NOWPAYMENTS_IPN_SECRET
        sync: false
      - key: NOWPAYMENTS_PUBLIC_KEY
        sync: false
      - key: NOWPAYMENTS_LTC_WALLET
        sync: false
      - key: NOWPAYMENTS_PAYOUTS_ENABLED
        sync: false
      - key: INCIDENT_PAYOUT_UNLOCK
        sync: false
      - key: NOWPAYMENTS_EMAIL
        sync: false
      - key: NOWPAYMENTS_PASSWORD
        sync: false
      - key: NOWPAYMENTS_PAYOUT_2FA_SECRET
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: PROVERKA_BOT_TOKEN
        sync: false
      - key: PROVERKA_WEBHOOK_SECRET
        sync: false
      - key: SITE_NOTIFY_BOT_TOKEN
        sync: false
      - key: SITE_NOTIFY_WEBHOOK_SECRET
        sync: false
      - key: PUBLIC_BASE_URL
        value: "https://cerber.to"
